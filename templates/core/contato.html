{% extends 'core/base.html' %}
{% block content %}
<section class="py-5">
    <div class="container">
        <h1 class="text-center mb-5 fw-bold">Fale Connosco</h1>
        <div class="row justify-content-center">
            <div class="col-md-6">
                {% if sucesso %}
                <div class="alert alert-success text-center p-4">
                    <h3>✅ Mensagem Enviada com Sucesso!</h3>
                    <p>Entraremos em contacto consigo em breve.</p>
                    <a href="/" class="btn btn-primary mt-2">Voltar à Página Inicial</a>
                </div>
                {% else %}
                <form method="POST" class="card p-4 shadow-lg">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Nome *</label>
                        <input type="text" name="nome" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">E-mail *</label>
                        <input type="email" name="email" class="form-control form-control-lg" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Telefone</label>
                        <input type="tel" name="telefone" class="form-control form-control-lg">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">Mensagem *</label>
                        <textarea name="mensagem" rows="5" class="form-control form-control-lg" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100">Enviar Mensagem</button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</section>
{% endblock %}
